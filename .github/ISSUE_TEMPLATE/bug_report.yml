name: Bug Report
description: File a bug report for Relay
title: "[Bug]: "
labels: ["bug"]
body:
  - type: input
    id: discord-version
    attributes:
      label: Discord version
      description: Which Discord release are you using?
      placeholder: Stable / PTB / Canary
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating System
      placeholder: Windows 11, macOS 14, etc.
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Error from DevTools console
      description: Paste the full error text (red output) from the console.
      render: shell
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Clear steps that led to the bug.
    validations:
      required: true
  - type: dropdown
    id: client-mod
    attributes:
      label: Vencord or BetterDiscord installed?
      options:
        - "No mods installed"
        - "Vencord"
        - "BetterDiscord"
        - "Both"
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: Additional info
      description: Any other details that might help.
